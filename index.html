<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/output.css" />
    <title>Baumeister|Home</title>

    <script src="src/partners.js"></script>
    <script src="src/services.js"></script>
  </head>

  <script>
    const loadComponents = (id, url, callback) => {
      fetch(url)
        .then((response) => response.text())
        .then((html) => {
          document.getElementById(id).innerHTML = html;
          if (callback) {
            callback();
          }
        })
        .catch((err) => console.error(err));
    };

    window.onload = () => {
      loadComponents("hero", "src/sections/hero.html");
      loadComponents("about", "src/sections/about.html");

      // UPDATE THIS LINE: Pass 'renderServices' as the 3rd argument
      loadComponents("service", "src/sections/service.html", renderServices);

      loadComponents(
        "eventBanner",
        "src/sections/eventBanner.html",
        renderPartnerList
      );

      loadComponents("footer", "src/sections/footer.html");
    };
  </script>

  <body>
    <script src="/src/header.js"></script>
    <div id="hero"></div>
    <div id="about"></div>

    <div id="service"></div>

    <div id="eventBanner"></div>
    <app-footer></app-footer>
    <script src="/src/footer.js"></script>
  </body>
</html>
