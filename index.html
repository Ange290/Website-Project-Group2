<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/output.css" />
    <title>Baumeister|Home</title>
  </head>
  <script>
    const loadComponents = (id, url) => {
      fetch(url)
        .then((response) => response.text())
        .then((html) => {
          document.getElementById(id).innerHTML = html;
        });
    };

    window.onload = () => {
      loadComponents("hero", "src/sections/hero.html");
      loadComponents("about", "src/sections/about.html");
      loadComponents("service", "src/sections/service.html");
      loadComponents("eventBanner", "src/sections/eventBanner.html");
      loadComponents("footer", "src/sections/footer.html");
      // loadComponents('contact', 'src/sections/contact.html');
      // loadComponents('footer', 'src/sections/footer.html');
    };
  </script>

  <body>
    <script src="/src/header.js"></script>
    <div id="hero"></div>
    <div id="about"></div>
    <div id="service"></div>
    <div id="eventBanner"></div>
    <!-- <div id="hero"></div>
    <div id="contact"></div>

     <div id="contact"></div>-->
     <app-footer></app-footer>
    <script src="/src/footer.js"></script> 
  </body>
</html>
